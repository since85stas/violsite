name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Ночная пересборка, чтобы вшитая в HTML афиша обновлялась (03:00 МСК)
    - cron: '0 0 * * *'
  # Кнопка «Run workflow» во вкладке Actions — пересобрать вручную (например, после правки таблицы концертов)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; уже начатый не отменяем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Узнаём адрес сайта: login.github.io/<репозиторий>/ или свой домен, если он привязан
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run build
        env:
          CONCERTS_CSV_URL: ${{ vars.CONCERTS_CSV_URL }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
